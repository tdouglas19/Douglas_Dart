[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "douglas-dart"
version = "0.1.0"
description = "Low-order propulsion and flight modeling for the Douglas Dart research vehicle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "PyYAML>=6.0",
  "six>=1.16",
]

[project.scripts]
douglas-dart = "douglas_dart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
