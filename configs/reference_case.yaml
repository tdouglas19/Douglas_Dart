# pulsejet_km: geometry for PULSEJET_KM_MODE (propulsion_map.py Gate 2),
# the sibling pulsejet-km (Khrulev & Muntyan) model. This is the real,
# externally-validated Argus As-014/V-1 geometry from pulsejet-km's own
# reference_cases.ARGUS_AS014_V1 -- NOT Douglas Dart's own vehicle-specific
# design point. There is no Douglas-Dart-shaped pulsejet-km geometry yet
# (see docs/pulsejet_external_model_audit.md); this section exists so
# PULSEJET_KM_MODE has real, validated data to run against and prove the
# integration pipeline works end-to-end, pending a real project-specific
# geometry being authored. constants.ignition_delay_cycle_fraction/
# ignition_delay_temperature_coefficient use this session's empirically-
# verified recalibration (m=73.7/theta=0.90, pulsejet-km architecture.md
# Section 49) rather than the paper's own stale "preliminary" 0.30/0.10
# (which gives near-zero thrust, INSUFFICIENT_CYCLES) -- NOT YET the
# permanent default in pulsejet-km's own reference_cases.py, pending
# separate user review there; used here as the best currently-available
# value for this integration to produce a real, non-degenerate result.
pulsejet_km:
  geometry:
    chamber_length_m: 0.590
    chamber_cross_section_area_m2: 0.255176
    chamber_volume_m3: 0.150554
    resonance_tube_length_m: 3.0450
    nozzle_throat_area_m2: 0.119459
    valve_flow_area_m2: 0.05
    exhaust_pipe_friction_coefficient: 0.02
    nozzle_local_resistance_coefficient: 0.3
    relative_chamber_center_to_nozzle_distance: 0.25
    inlet_model: DIRECT_STRAIGHT
    inlet_channel_diameter_m: 0.32
    inlet_channel_length_m: 0.28
    inlet_channel_friction_coefficient: 0.02
    inlet_channel_local_resistance_coefficient: 0.3
  valve_petal:
    petal_length_m: 0.035
    petal_thickness_m: 0.00025
    petal_base_width_m: 0.038
    petal_tip_width_m: 0.038
    elastic_modulus_pa: 195.0e+9
    petal_count: 270
    opening_characteristic_diameter_m: 0.038
    valve_overlap_m: 0.002
    maximum_petal_lift_m: 0.008
    grate_type: wedge
    valve_model: DYNAMIC
    petal_material_density_kg_per_m3: 7850.0
  fuel:
    lower_heating_value_j_per_kg: 43.0e+6
    stoichiometric_air_fuel_ratio: 14.7
    fuel_characteristic_number: 1.219
  constants:
    ignition_delay_cycle_fraction: 73.7
    ignition_delay_temperature_coefficient: 0.90
    maximum_combustion_completeness: 0.725
    excess_air_ratio: 0.95
    net_thrust_drag_coefficient: 0.045
    rebound_coefficient: 0.4
    valve_closed_stability_lift_threshold: 0.002
    nozzle_flow_coefficient: 0.85
    reverse_flow_nozzle_discharge_coefficient: 1.0
    startup_combustion_duration: 1.0
    startup_fuel_mass_in_chamber: 0.01115

case:
  name: numerical_reference_not_a_design
  fuel_key: jet_a_reference

environment:
  altitude_m: 0.0
  # Raised from 0.20: sizing.py's static trade screens construct
  # PulsejetSimulator directly with a short fixed measurement window
  # (propulsion_map.py's module docstring explains why those call sites
  # bypass the common interface). With inlet_type: side below, real cycle
  # period lengthens sharply below roughly Mach 0.3-0.35 (refill is driven
  # by a weak pressure differential instead of ram pressure -- see
  # propulsion_map.py's _run_pulsejet_simulation, which adaptively extends
  # its own window so trajectory.py-routed callers see this correctly), so
  # a short fixed window at 0.20 reads as near-zero thrust even though the
  # engine is still firing, just more slowly. 0.40 keeps the original
  # intent (a representative subsonic pulsejet reference point) while
  # staying comfortably above where that fixed-window measurement is valid.
  mach: 0.40

selector:
  circular_intake_diameter_m: 0.195
  open_fraction: 0.500
  discharge_coefficient: 0.78
  pulsejet_total_pressure_recovery: 0.99
  ramjet_total_pressure_recovery: 0.92
  inlet_type: side

nozzle:
  throat_diameter_m: 0.100
  exit_to_throat_area_ratio: 2.25
  discharge_coefficient: 0.96

pulsejet:
  chamber_volume_m3: 0.025
  gamma: 1.33
  gas_constant_j_per_kg_k: 287.05
  combustion_efficiency: 0.58
  target_equivalence_ratio: 1.00
  initial_equivalence_ratio: 1.00
  burn_duration_s: 0.002
  minimum_cycle_period_s: 0.014
  ignition_pressure_ratio_max: 1.01
  minimum_fresh_air_fraction: 0.30
  wall_temperature_k: 500.0
  wall_heat_transfer_w_per_k: 20.0
  maximum_gas_temperature_k: 2600.0

ramjet:
  gamma: 1.40
  gas_constant_j_per_kg_k: 287.05
  mass_capture_coefficient: 0.90
  combustor_total_pressure_loss_fraction: 0.06
  combustor_efficiency: 0.96
  # target_equivalence_ratio, not a target exit temperature (2026-08-10 session):
  # mirrors PulsejetConfig.target_equivalence_ratio's input mechanism, but this is
  # a genuinely different value (0.60 lean vs. pulsejet's stoichiometric 1.00),
  # backed out of this vehicle's previous fixed-1900 K target -- confirmed by
  # direct computation to reproduce ~1900 K combustor exit temperature (now a
  # computed output, see ramjet.py's _solve_ramjet_cycle) across this vehicle's
  # operating Mach range.
  target_equivalence_ratio: 0.60
  # minimum_lightoff_test_mach is no longer set here -- derived by
  # ramjet.py's derive_lightoff_mach (config.py's load_reference_case),
  # not hand-picked. See RamjetConfig's docstring.
  minimum_self_sustaining_mach: 1.10

flight:
  reference_area_m2: 0.0810
  initial_mass_kg: 21.0
  zero_lift_drag_coefficient: 0.055
  induced_drag_factor: 0.18
  lift_curve_slope_per_rad: 2.50
  maximum_lift_coefficient: 0.90

vehicle:
  body_diameter_m: 0.195
  body_length_m: 2.20
  drag_area_reference_body_diameter_m: 0.200
  peak_mach_drag_area_ceiling_m2: 0.0095

mission:
  field_elevation_msl_m: 900.0
  sled_release_speed_min_m_per_s: 39.0
  sled_release_speed_max_m_per_s: 42.0
  top_of_climb_altitude_min_msl_m: 6000.0
  top_of_climb_altitude_max_msl_m: 6500.0
  speed_run_altitude_msl_m: 4500.0
  peak_mach: 1.10
  loaded_fuel_mass_kg: 3.80
  ramjet_speed_run_fuel_budget_kg: 1.40
  sled_rail_length_m: 75.0  # midpoint of stated 50-100 m range, representative pending real sled spec
  sled_launch_acceleration_g: 10.0  # UNSOURCED placeholder, no real accel ceiling set -- only bounds the search vs. the 75 m rail

requirements:
  maximum_takeoff_mass_kg: 25.0
  minimum_time_above_mach_one_s: 5.0
  minimum_peak_mach: 1.0
  landing_intact_required: true
  reciprocal_flight_same_day_required: true
  pulsejet_rule_status: confirmed_eligible_boomsupersonic_com_prize
  transonic_no_altitude_loss_required: true
  transonic_regime_start_mach: 0.80
  remote_pilot_abort_authority_required: true

openvsp:
  api_version: "3.51.2"
  body:
    forebody_transition_length_m: 0.14
    aft_taper_start_m: 1.75
    selector_radial_allowance_m: 0.0
    nozzle_radial_allowance_m: 0.0
    fuselage_tessellation: 49
  surface_tessellation: 16
  lifting_surface_count: 2
  lifting_surface_clocking_offset_deg: 0.0
  fin_count: 4
  fin_clocking_offset_deg: 45.0
  lifting_surface:
    x_location_m: 0.95
    exposed_semispan_m: 0.15
    root_chord_m: 0.40
    tip_chord_m: 0.14
    sweep_deg: 52.0
    thickness_to_chord: 0.06
  fin:
    x_location_m: 1.70
    exposed_semispan_m: 0.10
    root_chord_m: 0.30
    tip_chord_m: 0.10
    sweep_deg: 50.0
    thickness_to_chord: 0.05
  shell:
    # end_x_m must cover the fin root's full axial extent (x_location_m +
    # root_chord_m = 1.70 + 0.30 = 2.00) plus the aft taper length, so the fin root
    # sits entirely on the shell's constant-diameter span and never shows a gap
    # against the shell's own taper (see ReferenceCase.__post_init__).
    radial_offset_m: 0.019
    start_x_m: 0.16
    end_x_m: 2.07
    forward_taper_length_m: 0.05
    aft_taper_length_m: 0.05
    tessellation: 37
  ram_inlet:
    lip_overshoot_fraction: 0.05
    lip_fineness_ratio: 7.0
    tessellation: 13
  analysis:
    method: panel
    mach_values: [0.20, 0.60, 0.80, 1.00, 1.10]
    alpha_deg_values: [-2.0, 0.0, 2.0, 4.0, 6.0]
    beta_deg_values: [-3.0, 0.0, 3.0]
    reference_cg_x_m: 1.18
    wake_iterations: 5

simulation:
  pulsejet_duration_s: 0.25
  pulsejet_steady_warmup_s: 0.25
  pulsejet_steady_measurement_s: 0.25
  time_step_s: 0.00002
